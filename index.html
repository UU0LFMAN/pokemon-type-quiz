<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokémon Type Personality Quiz</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, "Noto Sans Thai", sans-serif;
  color: #f8fafc;
  background:
    radial-gradient(circle at top, #1e293b 0%, #0f172a 45%, #020617 100%);
}

.container {
  width: min(900px, 92%);
  margin: auto;
  padding: 50px 0;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
}

.card {
  background: rgba(15, 23, 42, 0.88);
  border: 1px solid rgba(148, 163, 184, 0.2);
  border-radius: 24px;
  padding: 35px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
}

h1 {
  font-size: clamp(32px, 6vw, 52px);
  margin: 0 0 15px;
}

h2.question {
  font-size: clamp(22px, 4vw, 31px);
  line-height: 1.45;
  margin: 25px 0;
  font-weight: 850;
}

.subtitle {
  color: #94a3b8;
  line-height: 1.7;
}

.progress {
  color: #94a3b8;
  font-size: 14px;
  margin-bottom: 12px;
}

.answer-list {
  display: grid;
  gap: 13px;
}

.answer-btn {
  width: 100%;
  text-align: left;
  border: 1px solid rgba(148, 163, 184, 0.18);
  background: rgba(30, 41, 59, 0.8);
  color: #f8fafc;
  border-radius: 16px;
  padding: 17px 19px;
  font-size: 16px;
  line-height: 1.5;
  cursor: pointer;
  transition: 0.18s ease;
}

.answer-btn:hover {
  transform: translateY(-2px);
  border-color: rgba(255,255,255,0.35);
  background: rgba(51, 65, 85, 0.95);
}

.answer-btn:active {
  transform: translateY(0);
}

button.primary {
  border: 0;
  border-radius: 14px;
  padding: 14px 24px;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  background: #f8fafc;
  color: #0f172a;
}

button.primary:hover {
  transform: translateY(-1px);
}

.result-type {
  font-size: clamp(45px, 9vw, 80px);
  font-weight: 900;
  margin: 10px 0;
}

.result-name {
  font-size: 22px;
  color: #cbd5e1;
  margin-bottom: 15px;
}

.result-description {
  color: #94a3b8;
  line-height: 1.8;
}

.score-box {
  margin-top: 30px;
  padding: 20px;
  background: rgba(2, 6, 23, 0.55);
  border-radius: 16px;
}

.score-row {
  display: grid;
  grid-template-columns: 120px 1fr 60px;
  gap: 10px;
  align-items: center;
  margin: 7px 0;
  font-size: 14px;
}

.bar {
  height: 8px;
  background: #1e293b;
  border-radius: 20px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  background: #94a3b8;
}

.small {
  font-size: 13px;
  color: #64748b;
}

.restart {
  margin-top: 25px;
}

@media (max-width: 600px) {
  .container {
    padding: 25px 0;
  }

  .card {
    padding: 23px;
    border-radius: 20px;
  }

  .score-row {
    grid-template-columns: 90px 1fr 50px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- START -->
  <section id="startScreen" class="screen active">
    <div class="card">
      <h1>🌌 Mystery Dungeon</h1>

      <p class="subtitle">
        หากคุณตื่นขึ้นมาในโลกแห่งการผจญภัย<br>
        จิตวิญญาณของคุณจะสอดคล้องกับธาตุใด?
      </p>

      <p class="subtitle">
        แบบทดสอบนี้มี 20 คำถาม
        โดย 18 ข้อแรกใช้วิเคราะห์บุคลิก
      </p>

      <button class="primary" onclick="startQuiz()">
        เริ่มการผจญภัย
      </button>
    </div>
  </section>


  <!-- QUIZ -->
  <section id="quizScreen" class="screen">
    <div class="card">

      <div class="progress" id="progressText"></div>

      <h2 id="questionText" class="question"></h2>

      <div id="answerList" class="answer-list"></div>

    </div>
  </section>


  <!-- RESULT -->
  <section id="resultScreen" class="screen">
    <div class="card">

      <div class="small">จิตวิญญาณของคุณคือ</div>

      <div id="resultType" class="result-type"></div>

      <div id="resultName" class="result-name"></div>

      <div id="resultDescription" class="result-description"></div>

      <div class="score-box">
        <strong>คะแนนทั้ง 18 ธาตุ</strong>
        <div id="scoreList"></div>
      </div>

      <button class="primary restart" onclick="location.reload()">
        เล่นอีกครั้ง
      </button>

    </div>
  </section>

</div>

        text: "นอนหลับฝันหวานกอดหมอน และตุ๊กตานุ่มฟูรอบเตียง",
        main: "Water",
        secondary: "Fairy",
        tertiary: "Grass",
        negative: "Dark"
      },

      {
        text: "นอนไม่ค่อยหลับเลยหาอะไรทำเรื่อยเปื่อย",
        main: "Steel",
        secondary: "Rock",
        tertiary: "Ground",
        negative: "Electric"
      },

      {
        text: "แอบไปนอนใต้เตียงบ้านเพื่อน",
        main: "Poison",
        secondary: "Dark",
        tertiary: "Bug",
        negative: "Fighting"
      }
    ]
  },


  /* =====================================================
     Q20 — FREE TYPE
  ===================================================== */

  {
    type: "free",

    text: "✨ ถ้าคุณสามารถเลือกพลังหนึ่งธาตุติดตัวไปตลอดการผจญภัย คุณจะเลือกอะไร?",

    answers: typeOrder.map(type => ({
      text: `${types[type].icon} ${types[type].name}`,
      freeType: type
    }))
  },

];


/* =========================================================
   SCORE
========================================================= */

let currentQuestion = 0;

const scores = {};

typeOrder.forEach(type => {
  scores[type] = 0;
});


/* =========================================================
   START
========================================================= */

function startQuiz() {

  currentQuestion = 0;

  typeOrder.forEach(type => {
    scores[type] = 0;
  });

  document.getElementById("startScreen")
    .classList.remove("active");

  document.getElementById("quizScreen")
    .classList.add("active");

  showQuestion();
}


/* =========================================================
   SHOW QUESTION
========================================================= */

function showQuestion() {

  const q = questions[currentQuestion];

  document.getElementById("progressText").textContent =
    `คำถาม ${currentQuestion + 1} / ${questions.length}`;

  /*
     ใช้ innerHTML เพื่อให้ question text
     สามารถมี <span style="..."> ได้
  */

  document.getElementById("questionText").innerHTML = q.text;

  const list = document.getElementById("answerList");

  list.innerHTML = "";

  q.answers.forEach((answer, index) => {

    const button = document.createElement("button");

    button.className = "answer-btn";

    button.innerHTML =
      `${String.fromCharCode(65 + index)}. ${answer.text}`;

    button.onclick = () => chooseAnswer(answer);

    list.appendChild(button);

  });
}


/* =========================================================
   CHOOSE ANSWER
========================================================= */

function chooseAnswer(answer) {

  const q = questions[currentQuestion];

  /*
     Q1-Q17
     Main       +1
     Secondary  +0.5
     Tertiary   +0.25
     Negative   -0.5
  */

  if (q.type !== "free" && q.type !== "flavor") {

    if (answer.main) {
      scores[answer.main] += 1;
    }

    if (answer.secondary) {
      scores[answer.secondary] += 0.5;
    }

    if (answer.tertiary) {
      scores[answer.tertiary] += 0.25;
    }

    if (answer.negative) {
      scores[answer.negative] -= 0.5;
    }
  }


  /*
     Q18
     Free Type = +0.75
  */

  if (q.type === "free") {

    if (answer.freeType) {
      scores[answer.freeType] += 0.75;
    }
  }


  /*
     Q19-Q20
     ไม่มีคะแนน
  */


  currentQuestion++;

  if (currentQuestion >= questions.length) {
    showResult();
  } else {
    showQuestion();
  }
}


/* =========================================================
   FIND RESULT
========================================================= */

function getResult() {

  let bestType = typeOrder[0];

  for (const type of typeOrder) {

    if (scores[type] > scores[bestType]) {
      bestType = type;
    }

  }

  return bestType;
}


/* =========================================================
   SHOW RESULT
========================================================= */

function showResult() {

  const result = getResult();

  const data = types[result];

  document.getElementById("quizScreen")
    .classList.remove("active");

  document.getElementById("resultScreen")
    .classList.add("active");


  document.getElementById("resultType").textContent =
    `${data.icon} ${data.name}`;

  document.getElementById("resultName").textContent =
    data.title;

  document.getElementById("resultDescription").textContent =
    data.description;


  /*
     แสดงคะแนนเรียงจากสูง → ต่ำ
  */

  const sorted = [...typeOrder]
    .sort((a, b) => scores[b] - scores[a]);


  const maxScore = Math.max(
    ...typeOrder.map(type => scores[type]),
    1
  );


  const scoreList = document.getElementById("scoreList");

  scoreList.innerHTML = "";


  sorted.forEach(type => {

    const row = document.createElement("div");

    row.className = "score-row";

    const score = scores[type];

    const percentage =
      Math.max(0, (score / maxScore) * 100);


    row.innerHTML = `
      <div>
        ${types[type].icon} ${type}
      </div>

      <div class="bar">
        <div
          class="bar-fill"
          style="width:${percentage}%">
        </div>
      </div>

      <div>
        ${score.toFixed(2)}
      </div>
    `;

    scoreList.appendChild(row);

  });


  /*
     เปิด Console เพื่อดูคะแนนดิบ
  */

  console.table(
    sorted.map(type => ({
      Type: type,
      Score: Number(scores[type].toFixed(2))
    }))
  );

  console.log("RESULT:", result);

}

</script>
